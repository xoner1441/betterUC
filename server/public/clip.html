<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="referrer" content="no-referrer">
  <title>Clip ansehen · betterUC</title>
  <link rel="stylesheet" href="/styles.css">
  <script defer src="/clip.js"></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/"><span class="brand-mark">bU</span><span>betterUC</span></a>
    <nav class="nav"><a href="/panel">Meine Mediengalerie</a></nav>
  </header>
  <main class="clip-page section">
    <p class="section-label">betterUC Clips</p>
    <h1 id="clipTitle">Dein Spielmoment.</h1>
    <p class="quiet">Nicht öffentlich gelistet. Jeder mit diesem Link kann diesen Clip ansehen – nicht die persönliche Galerie.</p>
    <p id="clipStatus" role="status">Clip wird geladen …</p>
    <section id="clipContent" hidden>
      <video id="clipPlayer" controls playsinline preload="none" aria-label="Clip abspielen"></video>
      <p id="clipMeta" class="quiet"></p>
      <div class="media-filters">
        <a id="clipDownload" class="button primary">Herunterladen</a>
        <button id="clipCopy" class="button secondary" type="button">Link kopieren</button>
        <a class="button secondary" href="/panel">Zur Mediengalerie</a>
      </div>
      <p id="clipCopyStatus" role="status"></p>
    </section>
  </main>
</body>
</html>
